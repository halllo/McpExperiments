<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'" />
<title>My Agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A7%AD</text></svg>" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7fb;
    --panel: #ffffff;
    --panel-2: #fbfbfd;
    --text: #14161c;
    --muted: #5c6373;
    --border: #e3e6ee;
    --control-border: #8b90a0;
    --shadow: 0 1px 2px rgba(16, 20, 35, .05), 0 8px 24px rgba(16, 20, 35, .06);
    --brand: #6d28d9;
    --on-brand: #ffffff;
    --danger: #b91c1c;
    --ok: #047857;
    --run: #0369a1;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1017;
      --panel: #171a23;
      --panel-2: #1c2029;
      --text: #e8eaf0;
      --muted: #9aa2b4;
      --border: #272c38;
      --control-border: #5a6274;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      --brand: #a78bfa;
      --on-brand: #120d1c;
      --danger: #f87171;
      --ok: #34d399;
      --run: #38bdf8;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* A column as tall as the window, so the composer sits at its bottom even before there is a chat. */
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 16px 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
  .page-head { margin-bottom: 24px; }
  .page-head p { margin: 0; color: var(--muted); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }

  #transcript { flex: 1; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

  .msg {
    padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--panel); box-shadow: var(--shadow); overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; max-width: 85%; background: var(--brand); color: var(--on-brand); border-color: transparent; white-space: pre-wrap; }
  .msg .who { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  .tool {
    align-self: flex-start; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); padding: 4px 10px; border: 1px dashed var(--border); border-radius: 999px;
  }
  .tool.done::after { content: " ✓"; color: var(--ok); }

  .run-usage { align-self: flex-end; margin-top: -6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; cursor: default; }

  .plan { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
  .plan summary { list-style: none; cursor: pointer; }
  .plan summary::-webkit-details-marker { display: none; }
  .plan header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .plan header::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  .plan[open] header::before { transform: rotate(90deg); }
  .plan[open] summary { margin-bottom: 4px; }
  .plan .count { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .plan header::before { transition: none; } }
  .plan h2 { margin: 0; font-size: 15px; }
  .plan .goal { margin: 4px 0 10px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .plan ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .plan li { padding: 8px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--border); }
  .plan li .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .plan li .title { font-weight: 600; }
  .plan li .result { margin-top: 4px; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .plan .tokens { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plan .final { margin-top: 10px; overflow-wrap: anywhere; }

  /* Rendered markdown: assistant messages and the plan's final answer. */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md blockquote, .md .table-wrap { margin: 0 0 .7em; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1em 0 .4em; line-height: 1.3; font-size: 1em; }
  .md h1 { font-size: 1.35em; }
  .md h2 { font-size: 1.2em; }
  .md h3 { font-size: 1.08em; }
  .md ul, .md ol { padding-left: 1.4em; }
  .md li + li { margin-top: .2em; }
  .md li > ul, .md li > ol { margin: .2em 0 0; }
  .md a { color: var(--brand); }
  .md code {
    font: .9em ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: .05em .3em;
  }
  .md pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
  .md pre code { font-size: 13px; background: none; border: 0; padding: 0; white-space: pre; }
  .md blockquote { margin-left: 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
  .md .table-wrap { overflow-x: auto; }
  .md table { border-collapse: collapse; font-size: 14px; overflow-wrap: normal; }
  .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; vertical-align: top; }
  .md th { background: var(--panel-2); }

  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.pending, .badge.planning { color: var(--muted); }
  .badge.running, .badge.executing, .badge.synthesizing { color: var(--run); }
  .badge.completed { color: var(--ok); }
  .badge.failed { color: var(--danger); }

  /* --- suggestions: only before the first message ------------------------------------------- */
  .suggestions { margin: 0 0 24px; }
  .suggestions[hidden] { display: none; }
  .suggestions h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; }
  .suggestion-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 10px; }
  .suggestion {
    font: inherit; text-align: left; color: var(--text); cursor: pointer;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .suggestion:hover { border-color: var(--brand); box-shadow: var(--shadow); transform: translateY(-1px); }
  .suggestion:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .suggestion strong { font-size: 14px; font-weight: 600; }
  .suggestion span { font-size: 13px; color: var(--muted); }

  /* --- composer ---------------------------------------------------------------------------------- */
  .dock {
    position: sticky; bottom: 0; z-index: 1;
    padding: 16px 0 calc(16px + env(safe-area-inset-bottom));
    /* Fades the transcript out under the composer instead of cutting it off. */
    background: linear-gradient(to bottom, transparent, var(--bg) 18px);
  }
  .composer {
    background: var(--panel); border: 1px solid var(--control-border); border-radius: 18px;
    box-shadow: var(--shadow); padding: 12px 12px 10px 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: var(--brand); box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
  .composer textarea {
    display: block; width: 100%; resize: none; border: 0; outline: 0; padding: 4px 0; margin: 0;
    font: inherit; line-height: 1.5; color: var(--text); background: transparent;
    min-height: 1.5em; max-height: 40vh; overflow-y: auto;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .toolbar .spacer { flex: 1; }

  .agent-picker {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px; padding: 0 10px 0 10px; height: 32px;
    color: var(--muted); font-size: 13px; background: var(--panel-2);
  }
  .agent-picker:focus-within { border-color: var(--brand); }
  .agent-picker select {
    appearance: none; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-weight: 600; padding: 0 14px 0 0; cursor: pointer;
  }
  /* The native arrow is gone with appearance: none; this one sits where it was. */
  .agent-picker::after {
    content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); pointer-events: none;
  }

  .icon-button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px;
    border: 1px solid transparent; border-radius: 999px; padding: 0 10px; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--muted); background: transparent;
  }
  .icon-button:hover { color: var(--text); background: var(--panel-2); border-color: var(--border); }
  .icon-button:focus-visible, .send:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .icon-button svg, .send svg { width: 16px; height: 16px; flex: none; }

  .send {
    width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--brand); color: var(--on-brand); transition: opacity .15s, transform .1s;
  }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .35; cursor: default; transform: none; }
  .send .stop-icon { display: none; }
  .send.running .send-icon { display: none; }
  .send.running .stop-icon { display: block; }

  #status { color: var(--muted); font-size: 13px; }
  #status:empty { display: none; }
  .hint { margin: 6px 4px 0; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
  .hint kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel-2); }
  #error { color: var(--danger); }
  #error:empty { display: none; }

  @media (max-width: 520px) {
    .hint .keys { display: none; }
    .new-chat-label { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .suggestion, .composer, .send { transition: none; }
    .suggestion:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <h1>My Agent</h1>
    <p>Chat with an agent over AG-UI. Ask for something that takes several steps and watch its <code>plan_and_execute</code> tool work through the plan live.</p>
  </div>

  <section class="suggestions" id="suggestions" aria-labelledby="suggestions-title">
    <h2 id="suggestions-title">Try one of these</h2>
    <div class="suggestion-grid">
      <button type="button" class="suggestion" data-prompt="Use plan_and_execute: get the current UTC time, then use Python to calculate how many days, hours and minutes are left until New Year's Eve, then summarize the result in one sentence.">
        <strong>Countdown to New Year</strong><span>Time lookup, then Python, then a summary</span>
      </button>
      <button type="button" class="suggestion" data-prompt="Use plan_and_execute: generate 1,000 random numbers from a normal distribution with Python, compute mean, median and standard deviation, then check whether the result is consistent with the distribution you used, and explain any difference.">
        <strong>Random sample statistics</strong><span>Steps that build on each other's results</span>
      </button>
      <button type="button" class="suggestion" data-prompt="Find out what weekday it is in UTC right now, compute which weekday it will be exactly 1,000 days from now, and tell me how many of those 1,000 days fall on a weekend.">
        <strong>1,000 days from now</strong><span>Doesn't name the tool: does the agent plan?</span>
      </button>
      <button type="button" class="suggestion" data-prompt="Use plan_and_execute with one step per item: compute the 10th, 20th, 30th, 40th, 50th, 60th, 70th and 80th Fibonacci numbers, then sum them.">
        <strong>Fibonacci in 9 steps</strong><span>Asks for more steps than the plan allows</span>
      </button>
    </div>
  </section>

  <div id="transcript" aria-live="polite"></div>

  <div class="dock">
    <form id="form" class="composer">
      <label for="prompt" class="visually-hidden">Message</label>
      <textarea id="prompt" rows="1" required placeholder="Ask for something that takes a few steps…"></textarea>
      <div class="toolbar">
        <label class="agent-picker" title="Which agent answers">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="10" height="8" rx="2"/><path d="M8 2.5V5M6 9h.01M10 9h.01"/></svg>
          <span class="visually-hidden">Agent</span>
          <select id="agent"></select>
        </label>
        <button id="reset" type="button" class="icon-button" title="Start a new chat">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
          <span class="new-chat-label">New chat</span>
        </button>
        <span class="spacer"></span>
        <span id="status" aria-live="polite"></span>
        <button id="go" type="submit" class="send" aria-label="Send" disabled>
          <svg class="send-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
          <svg class="stop-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>
        </button>
      </div>
    </form>
    <div class="hint">
      <span id="error" role="alert"></span>
      <span class="keys"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const base = window.location.pathname.replace(/\/+$/, "");
  const el = id => document.getElementById(id);
  const transcript = el("transcript"), form = el("form"), prompt = el("prompt"), agentSelect = el("agent");
  const goButton = el("go"), statusBox = el("status"), errorBox = el("error"), suggestions = el("suggestions");

  // crypto.randomUUID needs a secure context, which a plain-http LAN address is not.
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(16).slice(2)}`);

  let activityType = "planner_executor";
  let contextEvent = "context_usage";
  let threadId = newId();
  let history = [];          // the thread as AG-UI messages: user and assistant text only
  let controller = null;

  // Follow the latest message while the reader is at the bottom; scrolling up to read stops it,
  // scrolling back down resumes it. The page itself only ever scrolls down, and a clamp from content
  // that shrinks lands exactly at the bottom, so any other upward scroll is the reader's.
  let pinned = true, lastY = window.scrollY, followQueued = false;
  const distanceToBottom = () => document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
  window.addEventListener("scroll", () => {
    const y = window.scrollY;
    if (y < lastY && distanceToBottom() > 2) pinned = false;
    else if (distanceToBottom() < 80) pinned = true;
    lastY = y;
  }, { passive: true });

  // One jump per frame, never smooth: an animation's intermediate positions would read as the reader scrolling up.
  function follow() {
    if (!pinned || followQueued) return;
    followQueued = true;
    requestAnimationFrame(() => {
      followQueued = false;
      if (pinned) window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "auto" });
    });
  }

  fetch(`${base}/info`)
    .then(response => response.ok ? response.json() : null)
    .then(info => {
      const names = info?.agents ?? ["amazonbedrock", "openai"];
      agentSelect.replaceChildren(...names.map(name => new Option(name, name)));
      if (info?.activityType) activityType = info.activityType;
      if (info?.contextEvent) contextEvent = info.contextEvent;
    })
    .catch(() => agentSelect.replaceChildren(new Option("amazonbedrock", "amazonbedrock")));

  form.addEventListener("submit", event => {
    event.preventDefault();
    if (controller) { controller.abort(); return; }
    const text = prompt.value.trim();
    if (!text) { prompt.focus(); return; }
    prompt.value = "";
    composerChanged();
    run(text);
  });

  // Enter sends, Shift+Enter breaks the line. Not while an IME is composing: its Enter confirms a word.
  prompt.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
  prompt.addEventListener("input", composerChanged);
  window.addEventListener("resize", composerChanged);

  // Grows with its text up to the CSS max-height, then scrolls; and Send only lights up with something to send.
  function composerChanged() {
    prompt.style.height = "auto";
    prompt.style.height = `${prompt.scrollHeight}px`;
    goButton.disabled = !controller && !prompt.value.trim();
  }

  function setRunning(running) {
    goButton.classList.toggle("running", running);
    goButton.setAttribute("aria-label", running ? "Stop" : "Send");
    goButton.title = running ? "Stop" : "Send";
    composerChanged();
  }

  // Suggestions are for an empty chat: the first message puts them away, a new chat brings them back.
  function showSuggestions() { suggestions.hidden = history.length > 0; }

  // A suggestion fills the input rather than sending it: every run is paid, so the reader presses Send.
  for (const card of suggestions.querySelectorAll(".suggestion")) {
    card.title = card.dataset.prompt;
    card.addEventListener("click", () => {
      prompt.value = card.dataset.prompt;
      composerChanged();
      prompt.focus();
      prompt.setSelectionRange(prompt.value.length, prompt.value.length);
    });
  }

  el("reset").addEventListener("click", () => {
    controller?.abort();
    threadId = newId();
    history = [];
    transcript.replaceChildren();
    errorBox.textContent = "";
    statusBox.textContent = "";
    showSuggestions();
    prompt.focus();
  });

  async function run(text) {
    errorBox.textContent = "";
    const userMessage = { id: newId(), role: "user", content: text };
    history.push(userMessage);
    showSuggestions();
    pinned = true;
    addBubble("user", text);

    const state = { messages: new Map(), tools: new Map(), plans: new Map(), order: [] };
    controller = new AbortController();
    setRunning(true);
    statusBox.textContent = "Running…";
    let terminated = false;

    try {
      // POSTed, never EventSource: fetch does not reconnect, so a dropped stream cannot start a second paid run.
      const response = await fetch(`${base}/${encodeURIComponent(agentSelect.value)}/agui`, {
        method: "POST",
        headers: { "content-type": "application/json", "accept": "text/event-stream" },
        signal: controller.signal,
        body: JSON.stringify({ threadId, runId: newId(), messages: history, tools: [], context: [] }),
      });

      if (!response.ok) { fail(await failureText(response)); return; }

      for await (const event of aguiEvents(response.body)) {
        handle(event, state);
        follow();
        if (event.type === "RUN_FINISHED" || event.type === "RUN_ERROR") { terminated = true; break; }
      }

      if (!terminated) fail("The connection ended before the run finished.");
    } catch (failure) {
      if (failure.name !== "AbortError") { console.error(failure); fail("The connection to the agent was lost."); }
      else statusBox.textContent = "Stopped.";
    } finally {
      // Whatever the agent said becomes part of the thread the next run sends.
      for (const id of state.order) {
        const content = state.messages.get(id)?.text ?? "";
        if (content.trim()) history.push({ id, role: "assistant", content });
      }
      controller = null;
      setRunning(false);
    }
  }

  function handle(event, state) {
    switch (event.type) {
      case "TEXT_MESSAGE_START": {
        if (!state.messages.has(event.messageId)) {
          state.messages.set(event.messageId, { text: "", bubble: null, name: event.name });
          state.order.push(event.messageId);
        }
        break;
      }
      case "TEXT_MESSAGE_CONTENT": {
        const message = state.messages.get(event.messageId);
        if (!message) break;
        message.text += event.delta ?? "";
        // A message that only parents a tool call never says anything, so its bubble waits for text.
        message.bubble ??= addBubble("assistant", "", message.name ?? agentSelect.value);
        // The whole text is re-rendered each time, so a span closes as soon as its closing marker arrives.
        message.bubble.body.replaceChildren(markdown(message.text));
        break;
      }
      case "TOOL_CALL_START": {
        if (state.tools.has(event.toolCallId)) break;
        const chip = document.createElement("div");
        chip.className = "tool";
        chip.textContent = `🔧 ${event.toolCallName}`;
        transcript.appendChild(chip);
        state.tools.set(event.toolCallId, chip);
        break;
      }
      case "TOOL_CALL_RESULT": {
        state.tools.get(event.toolCallId)?.classList.add("done");
        break;
      }
      case "ACTIVITY_SNAPSHOT": {
        if (event.activityType !== activityType) break;
        let card = state.plans.get(event.messageId);
        if (!card) {
          card = document.createElement("details");
          card.className = "plan";
          card.open = true;
          // The card's id is "activity-<tool call id>", so it sits right under the call that started it.
          const chip = state.tools.get(event.messageId.replace(/^activity-/, ""));
          if (chip) chip.after(card); else transcript.appendChild(card);
          state.plans.set(event.messageId, card);
        }
        renderPlan(card, event.content ?? {});
        break;
      }
      case "CUSTOM": {
        if (event.name === contextEvent) state.context = event.value;
        break;
      }
      case "RUN_FINISHED": {
        statusBox.textContent = event.outcome?.type === "interrupt"
          ? "The agent asked for approval, which this page does not support."
          : "";
        runUsage(event.usage, state.context);
        break;
      }
      case "RUN_ERROR": {
        fail(event.message || "The run failed.");
        break;
      }
    }
  }

  // Each snapshot is the whole state, so the card's contents are simply redrawn; the card itself
  // stays, and with it whether the reader has opened or closed it.
  function renderPlan(card, plan) {
    const steps = plan.steps ?? [];
    const completed = steps.filter(step => step.status === "completed").length;

    const header = document.createElement("header");
    const title = document.createElement("h2");
    title.textContent = "Plan";
    const count = document.createElement("span");
    count.className = "count";
    if (steps.length) count.textContent = `${completed}/${steps.length} steps`;
    header.append(title, count, tokens(plan.usage), badge(plan.status));
    const summary = document.createElement("summary");
    summary.appendChild(header);

    const goal = document.createElement("p");
    goal.className = "goal";
    goal.textContent = plan.goal ?? "";

    const list = document.createElement("ol");
    for (const step of steps) {
      const item = document.createElement("li");
      const head = document.createElement("div");
      head.className = "row";
      const name = document.createElement("span");
      name.className = "title";
      name.textContent = step.title;
      head.append(badge(step.status), name, tokens(step.usage));
      item.appendChild(head);
      if (step.result) {
        const result = document.createElement("div");
        result.className = "result";
        result.textContent = step.result;
        item.appendChild(result);
      }
      list.appendChild(item);
    }

    card.replaceChildren(summary, goal, list);

    // Collapse once, when the last step completes; a reader who reopens it keeps it open.
    if (steps.length && completed === steps.length && !card.dataset.collapsed) {
      card.dataset.collapsed = "true";
      card.open = false;
    }

    if (plan.result) {
      const final = document.createElement("div");
      final.className = "final md";
      final.appendChild(markdown(plan.result));
      card.appendChild(final);
    }
  }

  // Shown only once a call has reported usage; a provider that reports none leaves it blank.
  function tokens(usage) {
    const span = document.createElement("span");
    span.className = "tokens";
    const total = usage?.totalTokens ?? ((usage?.inputTokens ?? 0) + (usage?.outputTokens ?? 0));
    if (usage && total) {
      span.textContent = `${total.toLocaleString()} tokens`;
      span.title = `${(usage.inputTokens ?? 0).toLocaleString()} in · ${(usage.outputTokens ?? 0).toLocaleString()} out`;
    }
    return span;
  }

  // RUN_FINISHED.usage is one entry per model, and already includes what any plan spent; context
  // is the last model call's tokens, which the next run starts from. A provider that reports no
  // usage adds no line.
  function runUsage(usage, context) {
    const entries = (Array.isArray(usage) ? usage : usage ? [usage] : [])
      .map(entry => ({ ...entry, total: entry.totalTokens ?? ((entry.inputTokens ?? 0) + (entry.outputTokens ?? 0)) }))
      .filter(entry => entry.total);
    if (!entries.length) return;

    const sum = key => entries.reduce((total, entry) => total + (entry[key] ?? 0), 0);
    const line = document.createElement("div");
    line.className = "run-usage";
    line.textContent = `${sum("total").toLocaleString()} tokens used · ${sum("inputTokens").toLocaleString()} in · ${sum("outputTokens").toLocaleString()} out`;
    const contextTotal = context?.totalTokens ?? ((context?.inputTokens ?? 0) + (context?.outputTokens ?? 0));
    if (contextTotal) line.textContent += ` · ${contextTotal.toLocaleString()} in context`;
    const breakdown = entries.map(entry => {
      const parts = [`${(entry.inputTokens ?? 0).toLocaleString()} in`, `${(entry.outputTokens ?? 0).toLocaleString()} out`];
      if (entry.cachedInputTokens) parts.push(`${entry.cachedInputTokens.toLocaleString()} cached`);
      if (entry.reasoningTokens) parts.push(`${entry.reasoningTokens.toLocaleString()} reasoning`);
      return `${entry.model ?? "model"}: ${entry.total.toLocaleString()} (${parts.join(", ")})`;
    });
    if (contextTotal) breakdown.push(`Context for the next run: ${contextTotal.toLocaleString()} (the last call's ${(context.inputTokens ?? 0).toLocaleString()} in + ${(context.outputTokens ?? 0).toLocaleString()} out)`);
    line.title = breakdown.join("\n");
    transcript.appendChild(line);
  }

  function badge(status) {
    const span = document.createElement("span");
    span.className = `badge ${status ?? ""}`;
    span.textContent = status ?? "";
    return span;
  }

  function addBubble(role, text, who) {
    const bubble = document.createElement("div");
    bubble.className = `msg ${role}`;
    if (who) {
      const label = document.createElement("span");
      label.className = "who";
      label.textContent = who;
      bubble.appendChild(label);
    }
    const body = document.createElement("div");
    if (role === "assistant") body.className = "md";
    body.textContent = text;
    bubble.appendChild(body);
    transcript.appendChild(bubble);
    follow();
    return { bubble, body };
  }

  // A small markdown renderer for model output: headings, paragraphs, lists, fenced code, quotes,
  // rules, tables and the common inline spans. It builds DOM nodes and never parses HTML, so
  // nothing the model writes can become markup; links are kept only for http(s) and mailto.
  const FENCE = /^ {0,3}(`{3,}|~{3,})\s*([^`\s]*)/;
  const HEADING = /^ {0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/;
  const RULE = /^ {0,3}([-*_])(?:\s*\1){2,}\s*$/;
  const QUOTE = /^ {0,3}>\s?/;
  const ITEM = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
  const TABLE_RULE = /^\s*\|?\s*:?-+:?\s*(?:\|\s*:?-+:?\s*)*\|?\s*$/;

  function make(tag, text) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function markdown(source) {
    const fragment = document.createDocumentFragment();
    appendBlocks(fragment, source.replace(/\r\n?/g, "\n").split("\n"));
    return fragment;
  }

  const startsTable = (lines, i) => lines[i].includes("|") && i + 1 < lines.length && lines[i + 1].includes("|") && TABLE_RULE.test(lines[i + 1]);
  const startsBlock = (lines, i) => [FENCE, HEADING, RULE, QUOTE, ITEM].some(pattern => pattern.test(lines[i])) || startsTable(lines, i);

  function appendBlocks(parent, lines) {
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      let match;
      if (!line.trim()) {
        i++;
      } else if ((match = FENCE.exec(line))) {
        // An unclosed fence runs to the end, which is what a half-streamed code block should look like.
        const body = [];
        for (i++; i < lines.length && !lines[i].trimStart().startsWith(match[1]); i++) body.push(lines[i]);
        i++;
        const pre = make("pre");
        pre.appendChild(make("code", body.join("\n")));
        parent.appendChild(pre);
      } else if ((match = HEADING.exec(line))) {
        parent.appendChild(inline(make(`h${match[1].length}`), match[2]));
        i++;
      } else if (RULE.test(line)) {
        parent.appendChild(make("hr"));
        i++;
      } else if (QUOTE.test(line)) {
        const body = [];
        for (; i < lines.length && QUOTE.test(lines[i]); i++) body.push(lines[i].replace(QUOTE, ""));
        const quote = make("blockquote");
        appendBlocks(quote, body);
        parent.appendChild(quote);
      } else if (startsTable(lines, i)) {
        i = appendTable(parent, lines, i);
      } else if (ITEM.test(line)) {
        i = appendList(parent, lines, i);
      } else {
        // Single newlines inside a paragraph stay line breaks, as chat models mean them.
        const body = [line.trim()];
        for (i++; i < lines.length && lines[i].trim() && !startsBlock(lines, i); i++) body.push(lines[i].trim());
        parent.appendChild(inline(make("p"), body.join("\n")));
      }
    }
  }

  function appendList(parent, lines, i) {
    const first = ITEM.exec(lines[i]);
    const indent = first[1].length, ordered = /\d/.test(first[2]);
    const list = make(ordered ? "ol" : "ul");
    if (ordered && parseInt(first[2], 10) !== 1) list.start = parseInt(first[2], 10);

    let match;
    while (i < lines.length && (match = ITEM.exec(lines[i])) && Math.abs(match[1].length - indent) < 2 && /\d/.test(match[2]) === ordered) {
      const contentIndent = match[1].length + match[2].length + 1;
      const body = [match[3]];
      let afterBlank = false;
      for (i++; i < lines.length; i++) {
        const next = lines[i];
        const lead = next.length - next.trimStart().length;
        if (!next.trim()) { afterBlank = true; body.push(""); }
        else if (lead >= indent + 2) { afterBlank = false; body.push(next.slice(Math.min(lead, contentIndent))); }
        else if (!afterBlank && !startsBlock(lines, i)) body.push(next.trim());   // a lazily wrapped line
        else break;
      }

      // The item's content is blocks of its own, nested lists among them; a lone leading paragraph is unwrapped so tight lists stay tight.
      const item = make("li");
      appendBlocks(item, body);
      if (item.firstChild?.nodeName === "P") item.firstChild.replaceWith(...item.firstChild.childNodes);
      list.appendChild(item);
    }

    parent.appendChild(list);
    return i;
  }

  function appendTable(parent, lines, i) {
    const cells = row => row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
    const aligns = cells(lines[i + 1]).map(rule =>
      rule.startsWith(":") && rule.endsWith(":") ? "center" : rule.endsWith(":") ? "right" : "");
    const row = (values, tag) => {
      const tr = make("tr");
      values.forEach((value, column) => {
        const cell = inline(make(tag), value);
        if (aligns[column]) cell.style.textAlign = aligns[column];
        tr.appendChild(cell);
      });
      return tr;
    };

    const table = make("table");
    const head = make("thead");
    head.appendChild(row(cells(lines[i]), "th"));
    const body = make("tbody");
    for (i += 2; i < lines.length && lines[i].trim() && lines[i].includes("|"); i++) body.appendChild(row(cells(lines[i]), "td"));
    table.append(head, body);

    const wrap = make("div");
    wrap.className = "table-wrap";
    wrap.appendChild(table);
    parent.appendChild(wrap);
    return i;
  }

  // The earliest match wins; on a tie, the earlier pattern (so ** beats *).
  const INLINE = [
    [/\\([\\`*_{}\[\]()#+\-.!|~>])/, match => document.createTextNode(match[1])],
    [/`([^`\n]+)`/, match => make("code", match[1])],
    [/\[([^\]\n]+)\]\(([^()\s]+)(?:\s+"[^"]*")?\)/, match => link(match[1], match[2])],
    [/\*\*(?=\S)([\s\S]*?\S)\*\*/, match => inline(make("strong"), match[1])],
    [/__(?=\S)([\s\S]*?\S)__(?!\w)/, match => inline(make("strong"), match[1])],
    [/~~(?=\S)([\s\S]*?\S)~~/, match => inline(make("del"), match[1])],
    [/\*(?=[^\s*])([^*\n]*?[^\s*])\*/, match => inline(make("em"), match[1])],
    [/(?<!\w)_(?=[^\s_])([^_\n]*?[^\s_])_(?!\w)/, match => inline(make("em"), match[1])],
    [/<?(https?:\/\/[^\s<>]*[^\s<>.,:;!?"'()\[\]])>?/, match => link(match[1], match[1], true)],
  ];

  function inline(parent, text) {
    while (text) {
      let best = null;
      for (const [pattern, build] of INLINE) {
        const match = pattern.exec(text);
        if (match && (!best || match.index < best.match.index)) best = { match, build };
      }
      if (!best) { appendText(parent, text); break; }
      appendText(parent, text.slice(0, best.match.index));
      parent.appendChild(best.build(best.match));
      text = text.slice(best.match.index + best.match[0].length);
    }
    return parent;
  }

  function appendText(parent, text) {
    text.split("\n").forEach((part, index) => {
      if (index) parent.appendChild(make("br"));
      if (part) parent.appendChild(document.createTextNode(part));
    });
  }

  // A bare URL is its own label, which must stay plain text: parsed, it would match as a link again.
  function link(label, href, plain = false) {
    const fill = node => (plain ? (node.textContent = label, node) : inline(node, label));
    let url = null;
    try { url = new URL(href, window.location.href); } catch { /* not a URL */ }
    if (!url || !["http:", "https:", "mailto:"].includes(url.protocol)) return fill(make("span"));
    const anchor = make("a");
    anchor.href = url.href;
    anchor.target = "_blank";
    anchor.rel = "noopener noreferrer";
    return fill(anchor);
  }

  function fail(text) {
    errorBox.textContent = text;
    statusBox.textContent = "";
  }

  async function failureText(response) {
    let detail = "";
    try { detail = JSON.parse(await response.text())?.error ?? ""; } catch { /* not our JSON */ }
    return detail || `The agent endpoint answered ${response.status}.`;
  }

  // A minimal server-sent-events reader: frames end at a blank line; a frame's payload is its data: lines.
  async function* aguiEvents(body) {
    const reader = body.getReader();
    const decoder = new TextDecoder();
    const boundary = /\r?\n\r?\n/;
    let buffer = "";
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) { const trailing = parseFrame(buffer); if (trailing) yield trailing; break; }
        buffer += decoder.decode(value, { stream: true });
        let match;
        while ((match = boundary.exec(buffer))) {
          const event = parseFrame(buffer.slice(0, match.index));
          buffer = buffer.slice(match.index + match[0].length);
          if (event) yield event;
        }
      }
    } finally {
      reader.cancel().catch(() => { /* already closed */ });
    }
  }

  function parseFrame(frame) {
    const data = frame.split(/\r?\n/).filter(line => line.startsWith("data:")).map(line => line.slice(5).trimStart()).join("\n");
    if (!data) return null;
    try { return JSON.parse(data); } catch { console.warn("Dropped an unreadable AG-UI frame."); return null; }
  }
})();
</script>
</body>
</html>
