<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'" />
<title>Agents</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A7%AD</text></svg>" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7fb;
    --panel: #ffffff;
    --panel-2: #fbfbfd;
    --text: #14161c;
    --muted: #5c6373;
    --border: #e3e6ee;
    --control-border: #8b90a0;
    --shadow: 0 1px 2px rgba(16, 20, 35, .05), 0 8px 24px rgba(16, 20, 35, .06);
    --brand: #6d28d9;
    --on-brand: #ffffff;
    --danger: #b91c1c;
    --ok: #047857;
    --run: #0369a1;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1017;
      --panel: #171a23;
      --panel-2: #1c2029;
      --text: #e8eaf0;
      --muted: #9aa2b4;
      --border: #272c38;
      --control-border: #5a6274;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      --brand: #a78bfa;
      --on-brand: #120d1c;
      --danger: #f87171;
      --ok: #34d399;
      --run: #38bdf8;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
  .page-head { margin-bottom: 24px; }
  .page-head p { margin: 0; color: var(--muted); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }

  #transcript { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

  .msg {
    padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--panel); box-shadow: var(--shadow); overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; max-width: 85%; background: var(--brand); color: var(--on-brand); border-color: transparent; white-space: pre-wrap; }
  .msg .who { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  .tool {
    align-self: flex-start; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); padding: 4px 10px; border: 1px dashed var(--border); border-radius: 999px;
  }
  .tool.done::after { content: " ✓"; color: var(--ok); }

  .plan { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
  .plan header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .plan h2 { margin: 0; font-size: 15px; }
  .plan .goal { margin: 4px 0 10px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .plan ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .plan li { padding: 8px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--border); }
  .plan li .title { font-weight: 600; }
  .plan li .result { margin-top: 4px; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .plan .tokens { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plan .final { margin-top: 10px; overflow-wrap: anywhere; }

  /* Rendered markdown: assistant messages and the plan's final answer. */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md blockquote, .md .table-wrap { margin: 0 0 .7em; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1em 0 .4em; line-height: 1.3; font-size: 1em; }
  .md h1 { font-size: 1.35em; }
  .md h2 { font-size: 1.2em; }
  .md h3 { font-size: 1.08em; }
  .md ul, .md ol { padding-left: 1.4em; }
  .md li + li { margin-top: .2em; }
  .md li > ul, .md li > ol { margin: .2em 0 0; }
  .md a { color: var(--brand); }
  .md code {
    font: .9em ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: .05em .3em;
  }
  .md pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
  .md pre code { font-size: 13px; background: none; border: 0; padding: 0; white-space: pre; }
  .md blockquote { margin-left: 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
  .md .table-wrap { overflow-x: auto; }
  .md table { border-collapse: collapse; font-size: 14px; overflow-wrap: normal; }
  .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; vertical-align: top; }
  .md th { background: var(--panel-2); }

  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.pending, .badge.planning { color: var(--muted); }
  .badge.running, .badge.executing, .badge.synthesizing { color: var(--run); }
  .badge.completed { color: var(--ok); }
  .badge.failed { color: var(--danger); }

  form { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  textarea, select {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--control-border); border-radius: 10px; padding: 10px 12px;
  }
  textarea { width: 100%; min-height: 80px; resize: vertical; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 18px;
    background: var(--brand); color: var(--on-brand); cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  #error { color: var(--danger); min-height: 1.6em; }
  #status { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <h1>Agents</h1>
    <p>Chat with an agent over AG-UI. Ask for something that takes several steps and watch its <code>plan_and_execute</code> tool work through the plan live.</p>
  </div>

  <div id="transcript" aria-live="polite"></div>

  <form id="form">
    <label for="prompt" class="visually-hidden">Message</label>
    <textarea id="prompt" required placeholder="e.g. Find the current UTC time, use Python to compute the days left until New Year, then summarize."></textarea>
    <div class="row">
      <label for="agent">Agent</label>
      <select id="agent"></select>
      <button id="go" type="submit">Send</button>
      <button id="reset" type="button" class="secondary">New chat</button>
      <span id="status"></span>
    </div>
    <div id="error" role="alert"></div>
  </form>
</div>

<script>
(() => {
  "use strict";

  const base = window.location.pathname.replace(/\/+$/, "");
  const el = id => document.getElementById(id);
  const transcript = el("transcript"), form = el("form"), prompt = el("prompt"), agentSelect = el("agent");
  const goButton = el("go"), statusBox = el("status"), errorBox = el("error");

  // crypto.randomUUID needs a secure context, which a plain-http LAN address is not.
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(16).slice(2)}`);

  let activityType = "planner_executor";
  let threadId = newId();
  let history = [];          // the thread as AG-UI messages: user and assistant text only
  let controller = null;

  // Follow the latest message while the reader is at the bottom; scrolling up to read stops it,
  // scrolling back down resumes it. The page itself only ever scrolls down, and a clamp from content
  // that shrinks lands exactly at the bottom, so any other upward scroll is the reader's.
  let pinned = true, lastY = window.scrollY, followQueued = false;
  const distanceToBottom = () => document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
  window.addEventListener("scroll", () => {
    const y = window.scrollY;
    if (y < lastY && distanceToBottom() > 2) pinned = false;
    else if (distanceToBottom() < 80) pinned = true;
    lastY = y;
  }, { passive: true });

  // One jump per frame, never smooth: an animation's intermediate positions would read as the reader scrolling up.
  function follow() {
    if (!pinned || followQueued) return;
    followQueued = true;
    requestAnimationFrame(() => {
      followQueued = false;
      if (pinned) window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "auto" });
    });
  }

  fetch(`${base}/info`)
    .then(response => response.ok ? response.json() : null)
    .then(info => {
      const names = info?.agents ?? ["amazonbedrock", "openai"];
      agentSelect.replaceChildren(...names.map(name => new Option(name, name)));
      if (info?.activityType) activityType = info.activityType;
    })
    .catch(() => agentSelect.replaceChildren(new Option("amazonbedrock", "amazonbedrock")));

  form.addEventListener("submit", event => {
    event.preventDefault();
    if (controller) { controller.abort(); return; }
    const text = prompt.value.trim();
    if (!text) { prompt.focus(); return; }
    prompt.value = "";
    run(text);
  });

  el("reset").addEventListener("click", () => {
    controller?.abort();
    threadId = newId();
    history = [];
    transcript.replaceChildren();
    errorBox.textContent = "";
  });

  async function run(text) {
    errorBox.textContent = "";
    const userMessage = { id: newId(), role: "user", content: text };
    history.push(userMessage);
    pinned = true;
    addBubble("user", text);

    const state = { messages: new Map(), tools: new Map(), plans: new Map(), order: [] };
    controller = new AbortController();
    goButton.textContent = "Stop";
    statusBox.textContent = "Running…";
    let terminated = false;

    try {
      // POSTed, never EventSource: fetch does not reconnect, so a dropped stream cannot start a second paid run.
      const response = await fetch(`${base}/${encodeURIComponent(agentSelect.value)}/agui`, {
        method: "POST",
        headers: { "content-type": "application/json", "accept": "text/event-stream" },
        signal: controller.signal,
        body: JSON.stringify({ threadId, runId: newId(), messages: history, tools: [], context: [] }),
      });

      if (!response.ok) { fail(await failureText(response)); return; }

      for await (const event of aguiEvents(response.body)) {
        handle(event, state);
        follow();
        if (event.type === "RUN_FINISHED" || event.type === "RUN_ERROR") { terminated = true; break; }
      }

      if (!terminated) fail("The connection ended before the run finished.");
    } catch (failure) {
      if (failure.name !== "AbortError") { console.error(failure); fail("The connection to the agent was lost."); }
      else statusBox.textContent = "Stopped.";
    } finally {
      // Whatever the agent said becomes part of the thread the next run sends.
      for (const id of state.order) {
        const content = state.messages.get(id)?.text ?? "";
        if (content.trim()) history.push({ id, role: "assistant", content });
      }
      controller = null;
      goButton.textContent = "Send";
    }
  }

  function handle(event, state) {
    switch (event.type) {
      case "TEXT_MESSAGE_START": {
        if (!state.messages.has(event.messageId)) {
          state.messages.set(event.messageId, { text: "", bubble: null, name: event.name });
          state.order.push(event.messageId);
        }
        break;
      }
      case "TEXT_MESSAGE_CONTENT": {
        const message = state.messages.get(event.messageId);
        if (!message) break;
        message.text += event.delta ?? "";
        // A message that only parents a tool call never says anything, so its bubble waits for text.
        message.bubble ??= addBubble("assistant", "", message.name ?? agentSelect.value);
        // The whole text is re-rendered each time, so a span closes as soon as its closing marker arrives.
        message.bubble.body.replaceChildren(markdown(message.text));
        break;
      }
      case "TOOL_CALL_START": {
        if (state.tools.has(event.toolCallId)) break;
        const chip = document.createElement("div");
        chip.className = "tool";
        chip.textContent = `🔧 ${event.toolCallName}`;
        transcript.appendChild(chip);
        state.tools.set(event.toolCallId, chip);
        break;
      }
      case "TOOL_CALL_RESULT": {
        state.tools.get(event.toolCallId)?.classList.add("done");
        break;
      }
      case "ACTIVITY_SNAPSHOT": {
        if (event.activityType !== activityType) break;
        let card = state.plans.get(event.messageId);
        if (!card) {
          card = document.createElement("section");
          card.className = "plan";
          // The card's id is "activity-<tool call id>", so it sits right under the call that started it.
          const chip = state.tools.get(event.messageId.replace(/^activity-/, ""));
          if (chip) chip.after(card); else transcript.appendChild(card);
          state.plans.set(event.messageId, card);
        }
        renderPlan(card, event.content ?? {});
        break;
      }
      case "RUN_FINISHED": {
        statusBox.textContent = event.outcome?.type === "interrupt"
          ? "The agent asked for approval, which this page does not support."
          : "";
        break;
      }
      case "RUN_ERROR": {
        fail(event.message || "The run failed.");
        break;
      }
    }
  }

  // Each snapshot is the whole state, so the card is simply redrawn.
  function renderPlan(card, plan) {
    const header = document.createElement("header");
    const title = document.createElement("h2");
    title.textContent = "Plan";
    header.append(title, tokens(plan.usage), badge(plan.status));

    const goal = document.createElement("p");
    goal.className = "goal";
    goal.textContent = plan.goal ?? "";

    const list = document.createElement("ol");
    for (const step of plan.steps ?? []) {
      const item = document.createElement("li");
      const head = document.createElement("div");
      head.className = "row";
      const name = document.createElement("span");
      name.className = "title";
      name.textContent = step.title;
      head.append(badge(step.status), name, tokens(step.usage));
      item.appendChild(head);
      if (step.result) {
        const result = document.createElement("div");
        result.className = "result";
        result.textContent = step.result;
        item.appendChild(result);
      }
      list.appendChild(item);
    }

    card.replaceChildren(header, goal, list);

    if (plan.result) {
      const final = document.createElement("div");
      final.className = "final md";
      final.appendChild(markdown(plan.result));
      card.appendChild(final);
    }
  }

  // Shown only once a call has reported usage; a provider that reports none leaves it blank.
  function tokens(usage) {
    const span = document.createElement("span");
    span.className = "tokens";
    const total = usage?.totalTokens ?? ((usage?.inputTokens ?? 0) + (usage?.outputTokens ?? 0));
    if (usage && total) {
      span.textContent = `${total.toLocaleString()} tokens`;
      span.title = `${(usage.inputTokens ?? 0).toLocaleString()} in · ${(usage.outputTokens ?? 0).toLocaleString()} out`;
    }
    return span;
  }

  function badge(status) {
    const span = document.createElement("span");
    span.className = `badge ${status ?? ""}`;
    span.textContent = status ?? "";
    return span;
  }

  function addBubble(role, text, who) {
    const bubble = document.createElement("div");
    bubble.className = `msg ${role}`;
    if (who) {
      const label = document.createElement("span");
      label.className = "who";
      label.textContent = who;
      bubble.appendChild(label);
    }
    const body = document.createElement("div");
    if (role === "assistant") body.className = "md";
    body.textContent = text;
    bubble.appendChild(body);
    transcript.appendChild(bubble);
    follow();
    return { bubble, body };
  }

  // A small markdown renderer for model output: headings, paragraphs, lists, fenced code, quotes,
  // rules, tables and the common inline spans. It builds DOM nodes and never parses HTML, so
  // nothing the model writes can become markup; links are kept only for http(s) and mailto.
  const FENCE = /^ {0,3}(`{3,}|~{3,})\s*([^`\s]*)/;
  const HEADING = /^ {0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/;
  const RULE = /^ {0,3}([-*_])(?:\s*\1){2,}\s*$/;
  const QUOTE = /^ {0,3}>\s?/;
  const ITEM = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
  const TABLE_RULE = /^\s*\|?\s*:?-+:?\s*(?:\|\s*:?-+:?\s*)*\|?\s*$/;

  function make(tag, text) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function markdown(source) {
    const fragment = document.createDocumentFragment();
    appendBlocks(fragment, source.replace(/\r\n?/g, "\n").split("\n"));
    return fragment;
  }

  const startsTable = (lines, i) => lines[i].includes("|") && i + 1 < lines.length && lines[i + 1].includes("|") && TABLE_RULE.test(lines[i + 1]);
  const startsBlock = (lines, i) => [FENCE, HEADING, RULE, QUOTE, ITEM].some(pattern => pattern.test(lines[i])) || startsTable(lines, i);

  function appendBlocks(parent, lines) {
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      let match;
      if (!line.trim()) {
        i++;
      } else if ((match = FENCE.exec(line))) {
        // An unclosed fence runs to the end, which is what a half-streamed code block should look like.
        const body = [];
        for (i++; i < lines.length && !lines[i].trimStart().startsWith(match[1]); i++) body.push(lines[i]);
        i++;
        const pre = make("pre");
        pre.appendChild(make("code", body.join("\n")));
        parent.appendChild(pre);
      } else if ((match = HEADING.exec(line))) {
        parent.appendChild(inline(make(`h${match[1].length}`), match[2]));
        i++;
      } else if (RULE.test(line)) {
        parent.appendChild(make("hr"));
        i++;
      } else if (QUOTE.test(line)) {
        const body = [];
        for (; i < lines.length && QUOTE.test(lines[i]); i++) body.push(lines[i].replace(QUOTE, ""));
        const quote = make("blockquote");
        appendBlocks(quote, body);
        parent.appendChild(quote);
      } else if (startsTable(lines, i)) {
        i = appendTable(parent, lines, i);
      } else if (ITEM.test(line)) {
        i = appendList(parent, lines, i);
      } else {
        // Single newlines inside a paragraph stay line breaks, as chat models mean them.
        const body = [line.trim()];
        for (i++; i < lines.length && lines[i].trim() && !startsBlock(lines, i); i++) body.push(lines[i].trim());
        parent.appendChild(inline(make("p"), body.join("\n")));
      }
    }
  }

  function appendList(parent, lines, i) {
    const first = ITEM.exec(lines[i]);
    const indent = first[1].length, ordered = /\d/.test(first[2]);
    const list = make(ordered ? "ol" : "ul");
    if (ordered && parseInt(first[2], 10) !== 1) list.start = parseInt(first[2], 10);

    let match;
    while (i < lines.length && (match = ITEM.exec(lines[i])) && Math.abs(match[1].length - indent) < 2 && /\d/.test(match[2]) === ordered) {
      const contentIndent = match[1].length + match[2].length + 1;
      const body = [match[3]];
      let afterBlank = false;
      for (i++; i < lines.length; i++) {
        const next = lines[i];
        const lead = next.length - next.trimStart().length;
        if (!next.trim()) { afterBlank = true; body.push(""); }
        else if (lead >= indent + 2) { afterBlank = false; body.push(next.slice(Math.min(lead, contentIndent))); }
        else if (!afterBlank && !startsBlock(lines, i)) body.push(next.trim());   // a lazily wrapped line
        else break;
      }

      // The item's content is blocks of its own, nested lists among them; a lone leading paragraph is unwrapped so tight lists stay tight.
      const item = make("li");
      appendBlocks(item, body);
      if (item.firstChild?.nodeName === "P") item.firstChild.replaceWith(...item.firstChild.childNodes);
      list.appendChild(item);
    }

    parent.appendChild(list);
    return i;
  }

  function appendTable(parent, lines, i) {
    const cells = row => row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
    const aligns = cells(lines[i + 1]).map(rule =>
      rule.startsWith(":") && rule.endsWith(":") ? "center" : rule.endsWith(":") ? "right" : "");
    const row = (values, tag) => {
      const tr = make("tr");
      values.forEach((value, column) => {
        const cell = inline(make(tag), value);
        if (aligns[column]) cell.style.textAlign = aligns[column];
        tr.appendChild(cell);
      });
      return tr;
    };

    const table = make("table");
    const head = make("thead");
    head.appendChild(row(cells(lines[i]), "th"));
    const body = make("tbody");
    for (i += 2; i < lines.length && lines[i].trim() && lines[i].includes("|"); i++) body.appendChild(row(cells(lines[i]), "td"));
    table.append(head, body);

    const wrap = make("div");
    wrap.className = "table-wrap";
    wrap.appendChild(table);
    parent.appendChild(wrap);
    return i;
  }

  // The earliest match wins; on a tie, the earlier pattern (so ** beats *).
  const INLINE = [
    [/\\([\\`*_{}\[\]()#+\-.!|~>])/, match => document.createTextNode(match[1])],
    [/`([^`\n]+)`/, match => make("code", match[1])],
    [/\[([^\]\n]+)\]\(([^()\s]+)(?:\s+"[^"]*")?\)/, match => link(match[1], match[2])],
    [/\*\*(?=\S)([\s\S]*?\S)\*\*/, match => inline(make("strong"), match[1])],
    [/__(?=\S)([\s\S]*?\S)__(?!\w)/, match => inline(make("strong"), match[1])],
    [/~~(?=\S)([\s\S]*?\S)~~/, match => inline(make("del"), match[1])],
    [/\*(?=[^\s*])([^*\n]*?[^\s*])\*/, match => inline(make("em"), match[1])],
    [/(?<!\w)_(?=[^\s_])([^_\n]*?[^\s_])_(?!\w)/, match => inline(make("em"), match[1])],
    [/<?(https?:\/\/[^\s<>]*[^\s<>.,:;!?"'()\[\]])>?/, match => link(match[1], match[1], true)],
  ];

  function inline(parent, text) {
    while (text) {
      let best = null;
      for (const [pattern, build] of INLINE) {
        const match = pattern.exec(text);
        if (match && (!best || match.index < best.match.index)) best = { match, build };
      }
      if (!best) { appendText(parent, text); break; }
      appendText(parent, text.slice(0, best.match.index));
      parent.appendChild(best.build(best.match));
      text = text.slice(best.match.index + best.match[0].length);
    }
    return parent;
  }

  function appendText(parent, text) {
    text.split("\n").forEach((part, index) => {
      if (index) parent.appendChild(make("br"));
      if (part) parent.appendChild(document.createTextNode(part));
    });
  }

  // A bare URL is its own label, which must stay plain text: parsed, it would match as a link again.
  function link(label, href, plain = false) {
    const fill = node => (plain ? (node.textContent = label, node) : inline(node, label));
    let url = null;
    try { url = new URL(href, window.location.href); } catch { /* not a URL */ }
    if (!url || !["http:", "https:", "mailto:"].includes(url.protocol)) return fill(make("span"));
    const anchor = make("a");
    anchor.href = url.href;
    anchor.target = "_blank";
    anchor.rel = "noopener noreferrer";
    return fill(anchor);
  }

  function fail(text) {
    errorBox.textContent = text;
    statusBox.textContent = "";
  }

  async function failureText(response) {
    let detail = "";
    try { detail = JSON.parse(await response.text())?.error ?? ""; } catch { /* not our JSON */ }
    return detail || `The agent endpoint answered ${response.status}.`;
  }

  // A minimal server-sent-events reader: frames end at a blank line; a frame's payload is its data: lines.
  async function* aguiEvents(body) {
    const reader = body.getReader();
    const decoder = new TextDecoder();
    const boundary = /\r?\n\r?\n/;
    let buffer = "";
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) { const trailing = parseFrame(buffer); if (trailing) yield trailing; break; }
        buffer += decoder.decode(value, { stream: true });
        let match;
        while ((match = boundary.exec(buffer))) {
          const event = parseFrame(buffer.slice(0, match.index));
          buffer = buffer.slice(match.index + match[0].length);
          if (event) yield event;
        }
      }
    } finally {
      reader.cancel().catch(() => { /* already closed */ });
    }
  }

  function parseFrame(frame) {
    const data = frame.split(/\r?\n/).filter(line => line.startsWith("data:")).map(line => line.slice(5).trimStart()).join("\n");
    if (!data) return null;
    try { return JSON.parse(data); } catch { console.warn("Dropped an unreadable AG-UI frame."); return null; }
  }
})();
</script>
</body>
